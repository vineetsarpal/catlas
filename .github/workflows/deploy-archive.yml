name: Check and deploy earthquake archive

on:
  push:
    branches: [main]
    paths:
      - 'services/exposure-archive/**'
      - '.github/workflows/deploy-archive.yml'
  pull_request:
    paths:
      - 'services/exposure-archive/**'
      - '.github/workflows/deploy-archive.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: earthquake-archive-${{ github.ref }}
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/exposure-archive
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/exposure-archive/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/exposure-archive
    env:
      CLOUDFLARE_ACCOUNT_ID: a7761ac0ab836c6c4043dd62fe61dce7
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Require deployment credential
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Add the CLOUDFLARE_API_TOKEN repository secret. See docs/catlas-cloudflare.md.'
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/exposure-archive/package-lock.json
      - run: npm ci
      - name: Deploy existing archive Worker
        run: npx --no-install wrangler deploy --message "GitHub $GITHUB_SHA"
